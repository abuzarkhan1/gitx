[workspace]
members = [
    "crates/gitx-cli",
    "crates/gitx-core",
    "crates/gitx-git",
    "crates/gitx-index",
    "crates/gitx-storage",
    "crates/gitx-history",
    "crates/gitx-analysis",
    "crates/gitx-graph",
    "crates/gitx-search",
    "crates/gitx-tui",
    "tests"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["GitX Contributors"]
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
gix = "0.66"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.28"
crossterm = "0.28"
petgraph = "0.6"
rayon = "1.10"
ignore = "0.4"
criterion = "0.5"

# cargo-dist release packaging (docs/18-RELEASE-ENGINEERING.md). Generated
# configuration; `cargo dist plan` shows what will be produced.
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI.
cargo-dist-version = "0.24.0"
# Installers and CI tools for these platforms: macOS, Linux, Windows.
# `aarch64-apple-darwin` and `x86_64-apple-darwin` for macOS,
# `x86_64-unknown-linux-gnu` for Linux, `x86_64-pc-windows-msvc` for Windows.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# The single binary that users install.
# Both the CLI and TUI are shipped; the CLI is the primary entrypoint.
command = ["gitx", "gitx-tui"]
# Publish installers and artifacts on tagged releases.
pr-run-mode = "upload"
# Never run the installer build on every PR (only tagged releases).
installers = ["shell", "powershell", "homebrew"]
# Checksums are generated automatically by cargo-dist for every artifact.
