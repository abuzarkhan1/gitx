[package]
name = "gitx-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gitx"
path = "src/main.rs"

[dependencies]
gitx-core = { path = "../gitx-core" }
gitx-git = { path = "../gitx-git" }
gitx-history = { path = "../gitx-history" }
gitx-analysis = { path = "../gitx-analysis" }
gitx-graph = { path = "../gitx-graph" }
gitx-index = { path = "../gitx-index" }
gitx-search = { path = "../gitx-search" }
gitx-services = { path = "../gitx-services" }
gitx-storage = { path = "../gitx-storage" }
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
clap_complete = "4.5"
serde.workspace = true
serde_json.workspace = true
rusqlite = { workspace = true }
chrono = { version = "0.4.34" }
toml = "0.8"
ctrlc = "3.4"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
