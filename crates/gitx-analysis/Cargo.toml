[package]
name = "gitx-analysis"
version = "0.1.0"
edition = "2024"
authors = ["GitX Contributors"]
license = "MIT"
repository = "https://github.com/abuzarkhan1/gitx"
keywords = ["git", "history", "analysis", "cli", "terminal"]
categories = ["command-line-utilities", "development-tools"]
description = "Deterministic repository intelligence: hotspots, risk, health, ownership, dependencies, symbols"

[dependencies]
gitx-core = { version = "0.1.0", path = "../gitx-core" }
gitx-git = { version = "0.1.0", path = "../gitx-git" }
gitx-history = { version = "0.1.0", path = "../gitx-history" }
anyhow = { workspace = true }
chrono = { version = "0.4.34", features = ["serde"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tracing = { workspace = true }
rusqlite = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "hotspots"
harness = false

[[bench]]
name = "operations"
harness = false
