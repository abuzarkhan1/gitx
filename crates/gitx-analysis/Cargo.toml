[package]
name = "gitx-analysis"
version = "0.1.0"
edition = "2024"

[dependencies]
gitx-core = { path = "../gitx-core" }
gitx-git = { path = "../gitx-git" }
anyhow = { workspace = true }
chrono = { version = "0.4.34", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "hotspots"
harness = false
