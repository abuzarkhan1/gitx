# cargo-dist release workflow (docs/18-RELEASE-ENGINEERING.md).
#
# On a semver tag (v0.1.0, v1.0.0, ...), this builds release binaries for
# macOS (arm64 + x86_64), Linux and Windows, verifies checksums, generates
# release notes from the changelog, and uploads the artifacts to the GitHub
# release. `cargo dist plan` in the repository root shows the full plan.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Run the full quality gate before anything is published (docs/18 §6).
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo bench -p gitx-analysis --no-run

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: gitx-x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: gitx-aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: gitx-x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: gitx-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Stage artifacts
        shell: bash
        run: |
          set -e
          mkdir -p dist
          EXE=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then EXE=".exe"; fi
          cp "target/${{ matrix.target }}/release/gitx${EXE}" "dist/gitx${EXE}"
          cp "target/${{ matrix.target }}/release/gitx-tui${EXE}" "dist/gitx-tui${EXE}"

      - name: Generate checksums (SHA-256)
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            sha256sum * > checksums.txt
          else
            shasum -a 256 * > checksums.txt
          fi
          cat checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  # Aggregate all platform artifacts into the GitHub release (docs/18 §5:
  # executable + checksum + release notes).
  publish:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Write release notes
        shell: bash
        run: |
          {
            echo "## GitX $GITHUB_REF_NAME"
            echo
            echo "Local-first repository intelligence and code archaeology."
            echo
            echo "### Artifacts"
            echo
            echo "Binaries per platform with SHA-256 checksums in \`checksums.txt\`."
            echo
            echo "### Install"
            echo
            echo "\`\`\`bash"
            echo "# Download the archive for your platform and run the binary."
            echo "# Shell completions: gitx completions <bash|zsh|fish|powershell>"
            echo "\`\`\`"
            echo
            echo "### Changelog"
            echo
            if [ -f CHANGELOG.md ]; then
              head -80 CHANGELOG.md
            else
              echo "See the commit history for changes since the previous release."
            fi
          } > RELEASE_NOTES.md

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
