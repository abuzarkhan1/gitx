name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy + test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting (docs/19 §1)
        run: cargo fmt --check

      - name: Clippy (docs/19 §1)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Compile (docs/19 §1)
        run: cargo check --workspace

      - name: Test (docs/14)
        run: cargo test --workspace

      - name: Benchmarks compile (docs/13)
        run: cargo bench -p gitx-analysis --no-run

      - name: Smoke test — CLI against a real repo (docs/18 §6)
        run: |
          set -e
          # Build the fixtures the same way the integration tests do, then run
          # the actual binary (not just the library) end-to-end.
          cargo build -p gitx-cli
          rm -rf /tmp/gitx-smoke && mkdir -p /tmp/gitx-smoke
          cd /tmp/gitx-smoke
          git init -q -b main
          git config user.email smoke@example.com
          git config user.name "Smoke Test"
          echo "fn main() {}" > main.rs
          git add -A && git commit -qm "feat: initial"
          GITX="$GITHUB_WORKSPACE/target/debug/gitx"
          "$GITX" --repo . info >/dev/null
          "$GITX" --repo . stats >/dev/null
          "$GITX" --repo . timeline --max 5 >/dev/null
          "$GITX" --repo . health >/dev/null
          "$GITX" --repo . hotspots >/dev/null
          "$GITX" --repo . search "initial" >/dev/null
          echo "smoke: all CLI commands exited 0"

  build-matrix:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build for ${{ matrix.target }} (docs/18 §3)
        run: cargo build --workspace --target ${{ matrix.target }}
